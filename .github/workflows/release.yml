name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or reconcile
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install supported npm
        run: npm install --global npm@11.6.2

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v$PACKAGE_VERSION"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"

          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "release tag must be $EXPECTED_TAG, received $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$TAG_COMMIT" != "$SOURCE_COMMIT" ]]; then
            echo "release tag $RELEASE_TAG resolves to $TAG_COMMIT, not checked-out $SOURCE_COMMIT" >&2
            exit 1
          fi

          metadata_file="$(mktemp)"
          error_file="$(mktemp)"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version gitHead --json >"$metadata_file" 2>"$error_file"; then
            if ! node - "$metadata_file" "$PACKAGE_VERSION" "$SOURCE_COMMIT" <<'NODE'
const [metadataPath, expectedVersion, expectedHead] = process.argv.slice(2);
const metadata = JSON.parse(require("fs").readFileSync(metadataPath, "utf8"));
if (
  !metadata ||
  Array.isArray(metadata) ||
  metadata.version !== expectedVersion ||
  typeof metadata.gitHead !== "string" ||
  metadata.gitHead !== expectedHead
) {
  process.exit(1);
}
NODE
            then
              echo "existing npm metadata is malformed or does not match $PACKAGE_NAME@$PACKAGE_VERSION at $SOURCE_COMMIT" >&2
              rm -f "$metadata_file" "$error_file"
              exit 1
            fi
            rm -f "$metadata_file" "$error_file"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already matches $SOURCE_COMMIT; publication is complete."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^npm error code E404\r?$' "$error_file"; then
            rm -f "$metadata_file" "$error_file"
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "unable to verify npm identity for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
            cat "$error_file" >&2
            rm -f "$metadata_file" "$error_file"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        if: steps.identity.outputs.already_published != 'true'
        run: npm publish --access public --provenance
