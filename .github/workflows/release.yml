name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or reconcile
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install supported npm
        run: npm install --global npm@11.6.2

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          SOURCE_COMMIT="$(git rev-parse HEAD)"

          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version $PACKAGE_VERSION does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

          PUBLISHED_HEAD="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead --json 2>/dev/null | tr -d '"\r\n' || true)"
          if [[ -n "$PUBLISHED_HEAD" && "$PUBLISHED_HEAD" != "null" ]]; then
            if [[ "$PUBLISHED_HEAD" != "$SOURCE_COMMIT" ]]; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists at gitHead $PUBLISHED_HEAD, not $SOURCE_COMMIT" >&2
              exit 1
            fi
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already matches $SOURCE_COMMIT; publication is complete."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        if: steps.identity.outputs.already_published != 'true'
        run: npm publish --access public --provenance
